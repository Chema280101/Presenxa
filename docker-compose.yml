version: "3.9"

services:
  # ── PostgreSQL con extensión PostGIS ─────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: asistencias_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: asistencias
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d asistencias"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (cache + pub/sub + BullMQ) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: asistencias_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Insight (UI para Redis) — solo desarrollo ───────────
  redis-insight:
    image: redis/redisinsight:latest
    container_name: asistencias_redis_ui
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
