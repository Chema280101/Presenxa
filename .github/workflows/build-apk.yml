name: Build Presenxa Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Build Presenxa Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (Required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: ⚡ Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🔄 Sync Capacitor Android
        run: pnpm --filter @asistencias/web exec cap sync android

      - name: 🔨 Build Android Debug APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Presenxa-Android-APK
          path: apps/web/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
