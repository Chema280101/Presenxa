version: "3.9"

services:
  # ── Base de Datos PostgreSQL ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: asistcontrol_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asistencias}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - asistcontrol_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-asistencias}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ── Cache & Rate Limit Redis ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: asistcontrol_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-""}
    volumes:
      - redisdata_prod:/data
    networks:
      - asistcontrol_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Web App & PWA (Next.js 15 Standalone) ───────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: asistcontrol_web_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-asistencias}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:-${NEXTAUTH_SECRET}}
      CRON_SECRET: ${CRON_SECRET:-${NEXTAUTH_SECRET}}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - asistcontrol_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ── Nginx Reverse Proxy & SSL ───────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: asistcontrol_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - asistcontrol_net

networks:
  asistcontrol_net:
    driver: bridge

volumes:
  pgdata_prod:
    driver: local
  redisdata_prod:
    driver: local
